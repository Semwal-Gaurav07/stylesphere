{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Stylesphere{% endblock %}</title>

  <!-- Local Compiled Tailwind CSS (Replaces CDNs) -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- HTMX & Alpine.js -->
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body 
  class="bg-[#0D0D12] text-neutral-100 min-h-screen flex flex-col antialiased selection:bg-indigo-600 selection:text-white"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  x-data="{ cartOpen: false }"
>
  <!-- Global Top Navigation -->
  <header class="sticky top-0 z-40 w-full glassmorphism border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <!-- Logo -->
      <a href="{% url 'store:product_list' %}" class="text-xl font-black tracking-widest text-white uppercase">
        Style<span class="text-indigo-500">sphere</span>
      </a>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-4">
        <!-- Account / Profile Link -->
        {% if user.is_authenticated %}
          <a href="{% url 'accounts:profile' %}" class="p-2 text-neutral-400 hover:text-white transition" title="My Account">
            <i class="bi bi-person text-lg"></i>
          </a>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="text-xs font-semibold text-neutral-300 hover:text-white transition">
            Sign In
          </a>
        {% endif %}

        <!-- Wishlist Link -->
        <a href="{% url 'store:wishlist_detail' %}" class="p-2 text-neutral-400 hover:text-white transition" title="Wishlist">
          <i class="bi bi-heart text-lg"></i>
        </a>

        <!-- Cart Drawer Trigger Button -->
        <button 
          @click="cartOpen = true" 
          class="relative p-2 text-neutral-400 hover:text-white transition flex items-center"
          aria-label="Open Cart"
        >
          <i class="bi bi-bag text-lg"></i>
          <!-- Live Cart Count Badge -->
          <span 
            id="cart-count-badge" 
            class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-indigo-600 text-[10px] font-bold text-white shadow-lg"
          >
            {{ cart|length|default:0 }}
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Slide-Over Cart Drawer -->
  {% include 'store/cart/_cart_drawer.html' %}

  <!-- Main View Content -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  <footer class="border-t border-white/10 py-6 text-center text-xs text-neutral-500">
    &copy; {{ now|date:"Y" }} Stylesphere. All rights reserved.
  </footer>
</body>
</html>
