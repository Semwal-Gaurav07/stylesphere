{% extends 'store/base.html' %}

{% block content %}
<div class="flex flex-col md:flex-row gap-8">
  
  <!-- Sidebar Search & Filters (HTMX Powered) -->
  <aside class="w-full md:w-64 shrink-0">
    <form 
      id="filter-form"
      hx-get="{% url 'store:product_list' %}"
      hx-target="#product-grid"
      hx-swap="outerHTML"
      hx-trigger="input delay:350ms, change"
      hx-push-url="true"
      hx-indicator="#filter-indicator"
      class="space-y-6 bg-[#16161F] border border-white/10 p-5 rounded-2xl sticky top-24"
    >
      <!-- Live Search Box -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Search</label>
        <div class="relative">
          <input 
            type="text" 
            name="q" 
            value="{{ search_query|default:'' }}" 
            placeholder="Search styles..." 
            class="w-full bg-[#0D0D12] border border-white/10 rounded-xl px-3 py-2 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <!-- Categories -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Categories</label>
        <div class="space-y-1.5">
          <a 
            href="{% url 'store:product_list' %}" 
            class="block text-sm {% if not category %}text-indigo-400 font-semibold{% else %}text-neutral-400 hover:text-white{% endif %} transition"
          >
            All Collections
          </a>
          {% for c in categories %}
            <a 
              href="{{ c.get_absolute_url }}" 
              class="block text-sm {% if category.slug == c.slug %}text-indigo-400 font-semibold{% else %}text-neutral-400 hover:text-white{% endif %} transition"
            >
              {{ c.name }}
            </a>
          {% endfor %}
        </div>
      </div>

      <!-- Price Range Filter -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Price Range ($)</label>
        <div class="flex items-center gap-2">
          <input 
            type="number" 
            name="min_price" 
            placeholder="Min" 
            class="w-1/2 bg-[#0D0D12] border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
          />
          <input 
            type="number" 
            name="max_price" 
            placeholder="Max" 
            class="w-1/2 bg-[#0D0D12] border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <!-- Sort Options -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-400 mb-2">Sort By</label>
        <select 
          name="sort" 
          class="w-full bg-[#0D0D12] border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
        >
          <option value="newest">Newest First</option>
          <option value="price_low">Price: Low to High</option>
          <option value="price_high">Price: High to Low</option>
        </select>
      </div>
    </form>
  </aside>

  <!-- Product Results Area -->
  <section class="flex-1">
    <!-- HTMX Loading Indicator -->
    <div id="filter-indicator" class="htmx-indicator mb-4 text-xs text-indigo-400 flex items-center gap-2">
      <span class="loading loading-spinner loading-xs"></span> Filtering items...
    </div>

    <!-- Product Grid Partial -->
    {% include 'store/product/_product_list_partial.html' %}
  </section>

</div>
{% endblock %}
