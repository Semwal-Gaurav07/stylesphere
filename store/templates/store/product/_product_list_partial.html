<div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
  {% for product in products %}
    <div 
      x-data="{
        tiltX: 0,
        tiltY: 0,
        handleMove(e) {
          const rect = $el.getBoundingClientRect();
          const x = e.clientX - rect.left - (rect.width / 2);
          const y = e.clientY - rect.top - (rect.height / 2);
          this.tiltX = -(y / rect.height) * 12;
          this.tiltY = (x / rect.width) * 12;
        },
        handleLeave() {
          this.tiltX = 0;
          this.tiltY = 0;
        }
      }"
      @mousemove="handleMove($event)"
      @mouseleave="handleLeave()"
      :style="`transform: perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg); transition: transform 0.15s ease-out;`"
      class="group relative flex flex-col bg-[#12121B] border border-white/10 rounded-2xl overflow-hidden hover:border-indigo-500/60 hover:cyber-glow transition-all duration-300"
    >
      <!-- Image & Badges Container -->
      <div class="relative aspect-[3/4] w-full overflow-hidden bg-neutral-950">
        
        <!-- Live Status Badge -->
        <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 rounded-full bg-black/70 backdrop-blur-md border border-white/10 px-2.5 py-1 text-[10px] font-bold text-white uppercase tracking-wider">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Available</span>
        </div>

        <!-- Primary Image -->
        <img 
          src="{{ product.image.url }}" 
          alt="{{ product.name }}" 
          class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110"
        />

        <!-- Hover Quick Actions Overlay -->
        <div class="absolute inset-x-3 bottom-3 z-20 translate-y-6 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 flex items-center gap-2">
          <button 
            hx-post="{% url 'store:cart_add' product.id %}"
            hx-target="#cart-drawer-content"
            hx-swap="innerHTML"
            @click="cartOpen = true"
            class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold uppercase tracking-wider text-white shadow-lg flex items-center justify-center gap-1.5 transition"
          >
            <i class="bi bi-bag-plus"></i> Quick Add
          </button>
        </div>
      </div>

      <!-- Card Body -->
      <div class="p-4 flex flex-1 flex-col justify-between bg-gradient-to-b from-[#12121B] to-[#0D0D14]">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-indigo-400 mb-1">{{ product.category.name }}</p>
          <h3 class="text-sm font-semibold text-white group-hover:text-indigo-300 transition truncate">
            <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
          </h3>
        </div>
        
        <div class="mt-4 pt-3 border-t border-white/5 flex items-center justify-between">
          <span class="text-base font-display font-extrabold text-white tracking-tight">${{ product.price }}</span>
          <span class="text-[11px] font-medium text-neutral-500 group-hover:text-neutral-300 transition">View Details →</span>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-span-full py-20 text-center text-neutral-400 cyber-glass rounded-3xl p-8 border border-white/10">
      <i class="bi bi-slash-circle text-4xl mb-3 block text-neutral-600"></i>
      <h3 class="text-base font-display font-bold text-white mb-1">NO ITEMS FOUND</h3>
      <p class="text-xs text-neutral-500">Try adjusting your keyword search or price filter slider.</p>
    </div>
  {% endfor %}
</div>
