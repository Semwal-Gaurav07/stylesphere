<!-- Responsive 2-column mobile, 3-column tablet, 4-column desktop -->
<div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-6">
  {% for product in products %}
    <div class="group relative flex flex-col bg-[#12121B] border border-white/10 rounded-xl sm:rounded-2xl overflow-hidden hover:border-indigo-500/60 transition-all duration-300">
      
      <!-- Product Image -->
      <div class="relative aspect-[3/4] w-full overflow-hidden bg-neutral-950">
        <!-- Stock status -->
        <div class="absolute top-2 left-2 z-20 flex items-center gap-1 rounded-full bg-black/70 backdrop-blur-md border border-white/10 px-2 py-0.5 text-[9px] sm:text-[10px] font-bold text-white uppercase tracking-wider">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="hidden xs:inline">In Stock</span>
        </div>

        <img 
          src="{{ product.image.url }}" 
          alt="{{ product.name }}" 
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        />

        <!-- Desktop Quick Add Button (Hover) -->
        <div class="hidden sm:flex absolute inset-x-2 bottom-2 z-20 translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300">
          <button 
            hx-post="{% url 'store:cart_add' product.id %}"
            hx-target="#cart-drawer-content"
            hx-swap="innerHTML"
            @click="cartOpen = true"
            class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-[11px] font-bold uppercase tracking-wider text-white shadow-lg flex items-center justify-center gap-1 transition"
          >
            <i class="bi bi-bag-plus"></i> Add
          </button>
        </div>
      </div>

      <!-- Product Meta -->
      <div class="p-3 sm:p-4 flex flex-1 flex-col justify-between bg-gradient-to-b from-[#12121B] to-[#0D0D14]">
        <div>
          <p class="text-[9px] sm:text-[10px] font-bold uppercase tracking-widest text-indigo-400 mb-0.5 sm:mb-1 truncate">{{ product.category.name }}</p>
          <h3 class="text-xs sm:text-sm font-semibold text-white group-hover:text-indigo-300 transition truncate">
            <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
          </h3>
        </div>
        
        <div class="mt-2 sm:mt-4 pt-2 sm:pt-3 border-t border-white/5 flex items-center justify-between">
          <span class="text-sm sm:text-base font-display font-extrabold text-white tracking-tight">${{ product.price }}</span>
          
          <!-- Mobile 1-Tap Add to Bag Button (Visible on mobile) -->
          <button 
            hx-post="{% url 'store:cart_add' product.id %}"
            hx-target="#cart-drawer-content"
            hx-swap="innerHTML"
            @click="cartOpen = true"
            class="sm:hidden p-1.5 rounded-lg bg-indigo-600 text-white text-xs"
            aria-label="Add to Bag"
          >
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-span-full py-16 text-center text-neutral-400 cyber-glass rounded-2xl p-6 border border-white/10">
      <i class="bi bi-slash-circle text-3xl mb-2 block text-neutral-600"></i>
      <h3 class="text-sm font-bold text-white mb-1">NO ITEMS FOUND</h3>
      <p class="text-xs text-neutral-500">Try adjusting your search criteria.</p>
    </div>
  {% endfor %}
</div>
