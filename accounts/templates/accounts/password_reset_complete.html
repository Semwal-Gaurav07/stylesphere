{% extends "store/base.html" %}

{% block title %}Password Reset Complete — Style Sphere{% endblock %}

{% block content %}
<div class="relative min-h-[70vh] flex items-center justify-center py-10 px-4">
    <div class="max-w-md w-full bg-zinc-950/90 border border-zinc-800 rounded-3xl p-8 sm:p-10 text-center space-y-4 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-3xl mx-auto mb-2">
            <i class="bi bi-check2-circle"></i>
        </div>
        <h2 class="text-2xl font-black text-white font-heading">Password Reset Successful!</h2>
        <p class="text-xs text-zinc-400 leading-relaxed">
            Your credentials have been securely updated. You can now sign in with your new password.
        </p>
        <div class="pt-4">
            <a href="{% url 'accounts:login' %}" class="w-full py-3.5 bg-red-600 hover:bg-red-500 text-white font-cta font-bold text-xs uppercase tracking-wider rounded-xl block transition-all shadow-lg">
                Sign In Now →
            </a>
        </div>
    </div>
</div>
{% endblock %}
