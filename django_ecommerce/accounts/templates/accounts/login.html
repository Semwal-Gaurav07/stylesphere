{% extends "store/base.html" %}

{% block title %}Sign In - Style Sphere VIP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-800">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-brand-neon/10 text-brand-neon flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="bi bi-person-fill"></i>
            </div>
            <h2 class="text-2xl font-black text-white font-heading">VIP MEMBER SIGN IN</h2>
            <p class="text-xs text-slate-400 mt-1">Access drop alerts, order history, and exclusive streetwear discounts.</p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'' }}">

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Username</label>
                <input type="text" name="username" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-neon transition-all" required autofocus placeholder="Enter your username">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Password</label>
                <input type="password" name="password" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-neon transition-all" required placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 bg-brand-neon hover:bg-cyan-300 text-black font-cta font-bold text-base rounded-full shadow-lg shadow-brand-neon/20 transition-all">
                SIGN IN TO ACCOUNT →
            </button>
        </form>

        <div class="border-t border-slate-800 my-6"></div>

        <p class="text-center text-xs text-slate-400">
            Don't have an account yet? 
            <a href="{% url 'accounts:register' %}{% if next %}?next={{ next }}{% endif %}" class="text-brand-pink font-bold underline ml-1">Create VIP Account</a>
        </p>
    </div>
</div>
{% endblock %}
