<div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
  {% for product in products %}
    <div class="group relative flex flex-col bg-[#16161F] border border-white/10 rounded-2xl overflow-hidden hover:border-indigo-500/50 transition duration-300">
      
      <!-- Product Image -->
      <div class="relative aspect-[3/4] w-full overflow-hidden bg-neutral-900">
        <img 
          src="{{ product.image.url }}" 
          alt="{{ product.name }}" 
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        />
      </div>

      <!-- Card Body -->
      <div class="p-4 flex flex-1 flex-col">
        <span class="text-xs text-neutral-400 uppercase tracking-wider">{{ product.category.name }}</span>
        <h3 class="mt-1 text-sm font-semibold text-white group-hover:text-indigo-400 transition">
          <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
        </h3>
        
        <div class="mt-auto pt-4 flex items-center justify-between">
          <span class="text-base font-bold text-white">${{ product.price }}</span>
          
          <!-- HTMX Add to Bag trigger -->
          <button 
            hx-post="{% url 'store:cart_add' product.id %}"
            hx-target="#cart-drawer-content"
            hx-swap="innerHTML"
            @click="cartOpen = true"
            class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition flex items-center gap-1"
          >
            <i class="bi bi-plus-lg"></i> Add
          </button>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-span-full py-16 text-center text-neutral-400">
      <i class="bi bi-search text-3xl mb-2 block text-neutral-600"></i>
      <p class="text-base">No products match your search criteria.</p>
    </div>
  {% endfor %}
</div>
